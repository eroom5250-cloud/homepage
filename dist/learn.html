<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>개별진도 학습실 | ALL IN ONE</title><link rel="icon" href="logo.svg"><style>
*{box-sizing:border-box}body{margin:0;background:#f7f8f9;color:#141c30;font:16px/1.8 system-ui,sans-serif;word-break:keep-all}header,main{max-width:1160px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #dfe2e7}header img{width:220px}a{color:inherit}h1{font-size:clamp(28px,4vw,44px);letter-spacing:-1.5px;margin-bottom:8px}p{color:#626976}button,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #dfe2e7;border-radius:6px;padding:11px 18px;background:white;color:#141c30}button:hover{border-color:#779d20}button:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid #779d20;outline-offset:3px}.primary{background:#141c30;color:white}.layout{display:grid;grid-template-columns:290px 1fr;gap:28px;margin-top:30px}aside,.lesson{background:white;border:1px solid #dfe2e7;border-radius:10px;padding:25px}aside button{display:block;width:100%;text-align:left;margin:8px 0}aside button[aria-current=true]{background:#d8fa71;border-color:#b4d74c}h2{font-size:24px}h3{font-size:19px}progress{width:100%;accent-color:#6b8f20}small{color:#626976}.sentence{font-size:clamp(24px,3vw,34px);background:#141c30;color:#d8fa71;padding:25px;border-radius:8px;line-height:1.6}textarea{width:100%;min-height:115px;border:1px solid #b8c0cd;border-radius:6px;padding:12px;resize:vertical}fieldset{border:0;margin:20px 0;padding:0}legend{font-weight:700;margin-bottom:10px}label.answer{display:block;padding:10px;margin:8px 0;border:1px solid #dfe2e7;border-radius:6px;cursor:pointer}input{accent-color:#628414}label.answer:has(input:checked){background:#f0f8dd;border-color:#87aa36}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}.feedback{padding:18px;border-radius:6px;background:#f0f4e9;margin-top:15px}.notice{font-size:14px;background:#e9eedf;padding:16px 20px;border-radius:7px}.tools{margin:30px 0;display:flex;gap:12px;flex-wrap:wrap}.status{font-size:14px;min-height:25px}.hidden{display:none}@media(max-width:720px){.layout{grid-template-columns:1fr}header,main{padding:18px}header img{width:180px}aside,.lesson{padding:20px}header a{font-size:14px}aside h2{margin-top:0}.sentence{padding:20px}}
</style></head><body><header><a href="index.html"><img src="logo.svg" alt="ALL IN ONE 에이아이영어학원"></a><a href="index.html">홈페이지로 돌아가기</a></header><main><h1>나의 속도로, 하나씩 확실하게.</h1><p>과정을 선택하고 문장을 읽어보세요. 나의 말로 설명한 뒤 퀴즈로 확인합니다.</p><div class="notice">체험용 학습실입니다. 진도와 메모는 이 브라우저에만 저장됩니다. 다른 기기와 공유되거나 선생님에게 전송되지 않습니다.</div><div class="layout"><aside><h2>나의 학습 과정</h2><div id="courses"></div><p id="progress-label"></p><progress id="progress" max="6" value="0" aria-label="전체 완료 진도"></progress><div id="lessons"></div></aside><article class="lesson" id="lesson"></article></div><p class="status" id="status" role="status"></p><div class="tools"><button id="export">학습 기록 다운로드</button><button id="reset">학습 기록 초기화</button></div></main><script src="learn.js"></script></body></html>
